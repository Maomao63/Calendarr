<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>Calendarr</title>
    <link rel="stylesheet" href="/styles.css?v=calendarr-14" />
  </head>
  <body>
    <div class="ambient ambient-one"></div>
    <div class="ambient ambient-two"></div>
    <main>
      <header>
        <div class="brand">
          <div class="brand-mark">C</div>
          <div><h1>Calendarr</h1><p data-i18n="subtitle">Your upcoming releases</p></div>
        </div>
        <div class="controls">
          <button id="todayButton" data-i18n="today">Today</button>
          <label class="view-select">
            <span data-i18n="view">View</span>
            <select id="viewSelect" aria-label="Calendar view">
              <option value="day" data-i18n="view1Day">1 Day</option>
              <option value="three" data-i18n="view3Days">3 Days</option>
              <option value="week" data-i18n="viewWeek">Week</option>
              <option value="month" data-i18n="viewMonth">Month</option>
            </select>
          </label>
          <label class="view-select">
            <span data-i18n="language">Language</span>
            <select id="langSelect" aria-label="Language">
              <option value="en">English</option>
              <option value="de">Deutsch</option>
            </select>
          </label>
          <div class="display-controls">
            <div class="display-switcher" aria-label="Display mode">
              <button data-display="names" aria-pressed="false" data-i18n="names">Names</button>
              <button data-display="dots" aria-pressed="false" data-i18n="dots">Dots</button>
            </div>
          </div>
          <div class="month-controls">
            <button id="previousButton" aria-label="Vorheriger Zeitraum">‹</button>
            <h2 id="monthTitle"></h2>
            <button id="nextButton" aria-label="Nächster Zeitraum">›</button>
          </div>
          <button id="settingsButton" class="icon-button settings-button" aria-label="Instanzen konfigurieren" title="Instanzen konfigurieren">⚙</button>
          <button id="refreshButton" class="icon-button" aria-label="Aktualisieren">↻</button>
        </div>
        <button id="toolbarToggle" class="toolbar-toggle" aria-label="Werkzeugleiste ausblenden" aria-expanded="true">⌃</button>
      </header>

      <section class="legend">
        <span id="status" class="status" data-i18n="loadingReleases">Loading releases...</span>
      </section>

      <section class="calendar-shell">
        <div id="weekdays" class="weekdays"></div>
        <div id="calendar" class="calendar" aria-live="polite"></div>
      </section>
    </main>

    <aside id="hoverPreview" class="hover-preview" aria-hidden="true" hidden>
      <div id="hoverPreviewPoster" class="hover-preview-poster"></div>
      <div class="hover-preview-copy">
        <span id="hoverPreviewType" class="pill"></span>
        <h3 id="hoverPreviewTitle"></h3>
        <p id="hoverPreviewSubtitle"></p>
        <p id="hoverPreviewRelease" class="hover-preview-release"></p>
        <p id="hoverPreviewOverview" class="hover-preview-overview"></p>
      </div>
    </aside>

    <aside id="dayListPreview" class="day-list-preview" aria-hidden="true" hidden>
      <div id="dayListPreviewHeader" class="day-list-preview-header">
        <span id="dayListPreviewDate"></span>
        <span id="dayListPreviewCount" class="pill"></span>
      </div>
      <div id="dayListPreviewItems" class="day-list-preview-items"></div>
    </aside>

    <div id="dayDetails" class="modal" hidden>
      <button id="dayBackdrop" class="backdrop" aria-label="Tagesansicht schließen"></button>
      <article class="day-detail-card">
        <button id="closeDayDetails" class="close" aria-label="Schließen">×</button>
        <header class="day-detail-header">
          <div><span class="eyebrow" data-i18n="releases">Releases</span><h2 id="dayDetailTitle"></h2></div>
          <span id="dayDetailCount" class="day-count"></span>
        </header>
        <div id="dayReleaseList" class="day-release-list"></div>
      </article>
    </div>

    <div id="configModal" class="modal" hidden>
      <button id="configBackdrop" class="backdrop" type="button" aria-label="Close configuration"></button>
      <article class="config-card">
        <header class="config-header">
          <div>
            <h2 data-i18n="settingsTitle">Configuration</h2>
            <p data-i18n="settingsSubtitle">Connect your Sonarr and Radarr instances.</p>
          </div>
          <button id="closeConfig" class="close" aria-label="Close">×</button>
        </header>
        <div class="config-tabs">
          <button class="config-tab active" data-config-service="sonarr" aria-selected="true">Sonarr</button>
          <button class="config-tab" data-config-service="radarr" aria-selected="false">Radarr</button>
        </div>
        <form id="configForm">
          <div class="config-panel active" data-config-panel="sonarr">
            <div id="sonarrInstanceList" class="instance-list"></div>
            <button class="add-instance" type="button" data-add-instance="sonarr" data-i18n="addInstance">+ Add Instance</button>
          </div>
          <div class="config-panel" data-config-panel="radarr" hidden>
            <div id="radarrInstanceList" class="instance-list"></div>
            <button class="add-instance" type="button" data-add-instance="radarr" data-i18n="addInstance">+ Add Instance</button>
          </div>
          <div id="configStatus" class="config-status"></div>
          <footer class="config-actions">
            <button id="cancelConfig" type="button" data-i18n="cancel">Cancel</button>
            <button id="saveConfig" type="submit" class="save-config" data-i18n="save">Save</button>
          </footer>
        </form>
      </article>
    </div>
    <script src="/api/settings.js"></script>
    <script src="/app.js?v=calendarr-15" defer></script>
  </body>
</html>
